[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bbdevbox"
version = "0.2.0"
description = "Observable CLI agent benchmarks with LangGraph and pluggable sandboxes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "langchain-openai>=1.0,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12", "build>=1,<2"]

[project.scripts]
bbdevbox = "bbdevbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bbdevbox = ["web/*.html", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"data/*.py" = ["ALL"]
"repair_yaml.py" = ["ALL"]
