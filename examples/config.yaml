# Copy and set model.name. Credentials are read from api_key_env, never written to run artifacts.
model:
  name: your-tool-calling-model
  base_url: null # e.g. http://localhost:8000/v1 for a compatible local server
  api_key_env: OPENAI_API_KEY
  max_output_tokens: 4096
  timeout: 120
  retries: 2
sandbox:
  backend: docker # docker | podman | local (trusted fixtures only)
  runtime: null # runsc on a Linux host with gVisor installed
  network: none # use bridge for dataset tasks requiring external HTTP/package downloads
  memory: 2g
  cpus: 2
  pids_limit: 256
  build_timeout: 600
  command_timeout: 60
agent:
  max_steps: 40
  max_tokens: 150000
  max_seconds: 1200
  multi_agent: true
  max_delegations: 3
  child_steps: 8
  allow_prompt_updates: false
context:
  max_input_tokens: 24000
  keep_recent_turns: 3
  output_chars: 12000
  chunk_chars: 6000
  summary_chars: 5000
  llm_summary: false
memory:
  mode: "off" # off | frozen | continual
  collection: default
  top_k: 3
  max_chars: 6000
workers: 2
attempts: 1
seed: 42
prompt_file: prompts/profiles.yaml
prompt_reload: false
